name: SKILL-SENTINEL CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "release/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Job 1: Backend & AI Engine Verification
  backend-test:
    name: Backend Lint, Test & Healthcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Code Quality & Syntax Lint
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/ ai-engine/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning-only lint for style conventions
          flake8 backend/ ai-engine/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Seed Database Test
        env:
          DATABASE_URL: sqlite:///./skill_sentinel.db
          APP_ENV: testing
        run: |
          python scripts/seed.py

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///./test_sentinel.db
          APP_ENV: testing
        run: |
          python -m pytest tests/ -v --junitxml=junit/test-results.xml

  # Job 2: Frontend Verification
  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Verification & Production Build
        working-directory: ./frontend
        run: npm run build

  # Job 3: Container Build Verification
  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: skill-sentinel-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: skill-sentinel-frontend:latest
