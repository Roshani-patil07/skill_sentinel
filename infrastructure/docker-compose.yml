version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sentinel-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_password
      POSTGRES_DB: skillsentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sentinel-net

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentinel-net

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: sentinel-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinel_user:sentinel_password@db:5432/skillsentinel_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=prod_sentinel_secret_key_sih2026
      - AI_MODE=simulation
      - CAMERA_FALLBACK_SIMULATION=true
    depends_on:
      - db
      - redis
    networks:
      - sentinel-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sentinel-net

volumes:
  postgres_data:
  redis_data:

networks:
  sentinel-net:
    driver: bridge
