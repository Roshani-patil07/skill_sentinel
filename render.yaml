services:
  # 1. FastAPI Backend Service
  - type: web
    name: skill-sentinel-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skill-sentinel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_MODE
        value: simulation
      - key: CAMERA_FALLBACK_SIMULATION
        value: "true"
      - key: CORS_ORIGINS
        value: https://skill-sentinel.vercel.app,http://localhost:5173

  # 2. React / Vite Frontend Static Site
  - type: web
    name: skill-sentinel-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://skill-sentinel-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://skill-sentinel-api.onrender.com
      - key: VITE_WS_URL
        value: wss://skill-sentinel-api.onrender.com/api/v1/ws

databases:
  - name: skill-sentinel-db
    databaseName: skill_sentinel_db
    user: sentinel_user
    plan: standard
